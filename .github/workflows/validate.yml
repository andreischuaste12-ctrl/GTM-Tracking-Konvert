name: Validate documentation and tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Markdown links and JSON fixtures
        run: python scripts/check_docs.py
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - name: Run inventory utility tests
        run: python -m unittest discover -s tests -v

  external-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        # Some public documentation hosts block automated probes; retain the report without
        # turning transient remote availability into a failing repository check.
        continue-on-error: true
        with:
          args: --verbose --no-progress --max-retries 3 --timeout 20 README.md SKILL.md references/official-references.md
